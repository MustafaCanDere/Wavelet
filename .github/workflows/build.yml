name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Decode signing key
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/belesify.jks"
          echo "BELESIFY_KEYSTORE=$RUNNER_TEMP/belesify.jks" >> "$GITHUB_ENV"
          echo "BELESIFY_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "BELESIFY_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "BELESIFY_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Build APK
        run: gradle -p android assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk Belesify.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Belesify.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build installer and portable exe
        working-directory: desktop
        run: |
          npm install
          npm run build:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/dist/*.exe

  # Every build of main becomes a downloadable release (v1.0.<run number>); a pushed v* tag uses its own name.
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Beleşify {0}', github.ref_name) || format('Beleşify 1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Windows için kurulum (`Belesify-Kurulum-*.exe`) ve taşınabilir (`Belesify-Tasinabilir-*.exe`) sürüm, Android için `Belesify.apk`.

            Dosyalar imzasız. Windows uyarı verirse **Ek bilgi → Yine de çalıştır**; Android'de bilinmeyen kaynaklardan yüklemeye izin ver.
          files: out/*

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Beleşify</title>
<meta name="theme-color" content="#120f17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: three-pane music app (sidebar, library view, queue drawer) over a fixed player bar; one committed dark look */
:root {
  --bg: #000000;
  --panel: #121212;
  --card: #181818;
  --raise: #1f1f1f;
  --hover: #2a2a2a;
  --line: #2c2c2c;
  --fg: #ffffff;
  --mute: #b3b3b3;
  --accent: #1ed760;
  --accent-ink: #000000;
  --danger: #f15e6c;
  --display: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 10px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 20px; height: 20px; fill: currentColor; flex: none; }

.app { height: 100%; display: grid; grid-template-columns: 248px minmax(0, 1fr) auto; grid-template-rows: minmax(0, 1fr) auto; gap: 8px; padding: 8px max(8px, env(safe-area-inset-right, 0px)) 0 max(8px, env(safe-area-inset-left, 0px)); }

/* Sidebar */
.side { grid-row: 1; background: var(--panel); border-radius: var(--r); display: flex; flex-direction: column; min-height: 0; padding: 18px 12px 12px; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; font-family: var(--display); font-weight: 900; font-size: 23px; letter-spacing: -0.04em; }
.brand-mark { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); }
.brand-mark svg { width: 18px; height: 18px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 14px; padding: 9px 10px; border-radius: 8px; color: var(--mute); font-weight: 600; font-size: 15px; text-align: left; }
.nav button:hover { color: var(--fg); background: var(--raise); }
.nav button.on { color: var(--fg); background: var(--raise); }
.nav button.on svg { color: var(--accent); }
.side-head { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 10px; color: var(--mute); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
.icon-btn { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--mute); }
.icon-btn:hover { color: var(--fg); background: var(--hover); }
.icon-btn.on { color: var(--accent); }
.pl-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 2px; }
.pl-list button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; text-align: left; }
.pl-list button:hover, .pl-list button.on { background: var(--raise); }
.pl-list img, .pl-list .pl-ico { width: 40px; height: 40px; border-radius: 6px; flex: none; object-fit: cover; }
.pl-ico { display: grid; place-items: center; background: linear-gradient(135deg, #450af5, #8e8ee5); }
.pl-meta { min-width: 0; }
.pl-meta b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-meta span { color: var(--mute); font-size: 12px; }
.add-files { display: flex; align-items: center; gap: 10px; justify-content: center; padding: 11px; border-radius: 999px; border: 1px solid var(--line); font-weight: 600; cursor: pointer; }
.add-files:hover { border-color: var(--fg); }
.add-files input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.add-files:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Main view */
.main { grid-row: 1; background: var(--panel); border-radius: var(--r); overflow-y: auto; min-height: 0; position: relative; }
.view { padding-block: 22px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 30px; }
@media (min-width: 760px) { .view { padding-left: 28px; padding-right: 28px; } }
.view.tinted { background: linear-gradient(180deg, var(--tint, #3a2a4d) 0, var(--panel) 340px); }
h1, h2 { font-family: var(--display); letter-spacing: -0.04em; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(28px, 4.2vw, 44px); font-weight: 900; line-height: 1.05; }
h2 { font-size: 22px; font-weight: 800; }
.sec { display: flex; flex-direction: column; gap: 14px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec-head p { margin: 0; color: var(--mute); font-size: 13px; }
.lede { margin: 6px 0 0; color: var(--mute); max-width: 60ch; line-height: 1.5; }

.quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 8px; }
.qtile { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.07); border-radius: 6px; overflow: hidden; text-align: left; font-weight: 700; position: relative; padding-right: 52px; min-height: 56px; }
.qtile:hover { background: rgba(255,255,255,0.13); }
.qtile img, .qtile .pl-ico { width: 56px; height: 56px; flex: none; border-radius: 0; object-fit: cover; }
.qtile span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qtile .fab { position: absolute; right: 8px; width: 36px; height: 36px; opacity: 0; transform: translateY(2px); }
.qtile:hover .fab, .qtile:focus-visible .fab { opacity: 1; transform: none; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(46%, 168px), 1fr)); gap: 16px; }
.card { background: var(--card); border-radius: 10px; padding: 10px; text-align: left; display: flex; flex-direction: column; gap: 10px; position: relative; }
.card:hover { background: var(--raise); }
.card-art { position: relative; }
.card-art img { width: 100%; aspect-ratio: 1; border-radius: 8px; display: block; box-shadow: 0 8px 24px rgba(0,0,0,0.45); }
.card .fab { position: absolute; right: 8px; bottom: 8px; opacity: 0; transform: translateY(6px); transition: opacity .15s, transform .15s; }
.card:hover .fab, .card:focus-within .fab, .card.playing .fab { opacity: 1; transform: none; }
.card b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card small { color: var(--mute); font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fab { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 6px 16px rgba(0,0,0,0.4); }
.fab:hover { transform: scale(1.05); filter: brightness(1.05); }
.fab svg { width: 22px; height: 22px; }

.genres { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(46%, 180px), 1fr)); gap: 14px; }
.genre { aspect-ratio: 16 / 10; border-radius: 10px; padding: 14px; text-align: left; font-family: var(--display); font-size: 20px; font-weight: 800; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
.genre small { font-family: var(--body); font-size: 12px; font-weight: 600; opacity: .8; }
.genre img { position: absolute; width: 44%; right: -6%; bottom: -6%; transform: rotate(22deg); border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.4); }

.note { display: flex; gap: 14px; align-items: flex-start; background: var(--raise); border-radius: 10px; padding: 16px; line-height: 1.5; }
.note p { margin: 0; color: var(--mute); max-width: 70ch; }
.note b { color: var(--fg); }

/* Track list */
.tl { display: flex; flex-direction: column; }
.tl-head, .row { display: grid; grid-template-columns: 34px minmax(0, 1fr) minmax(0, 0.55fr) 36px 52px 36px; align-items: center; gap: 12px; padding: 0 10px; }
.tl-head { color: var(--mute); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 8px; }
.row { min-height: 56px; border-radius: 6px; cursor: default; }
.row:hover, .row.sel { background: var(--hover); }
.row .num { color: var(--mute); text-align: center; font-variant-numeric: tabular-nums; position: relative; }
.row .num button { display: none; position: absolute; inset: -8px; place-items: center; color: var(--fg); }
.row:hover .num span, .row:focus-within .num span { visibility: hidden; }
.row:hover .num button, .row:focus-within .num button { display: grid; }
.row .t { display: flex; align-items: center; gap: 12px; min-width: 0; }
.row .t img { width: 40px; height: 40px; border-radius: 4px; flex: none; }
.row .t div { min-width: 0; }
.row .t b { display: block; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .t small, .row .g { color: var(--mute); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.row.cur .t b, .row.cur .num span { color: var(--accent); }
.row .d { color: var(--mute); font-variant-numeric: tabular-nums; text-align: right; }
.row .like { opacity: 0; }
.row:hover .like, .row .like.on, .row:focus-within .like { opacity: 1; }
.row .more { opacity: 0; }
.row:hover .more, .row:focus-within .more { opacity: 1; }
.tag { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-ink); background: var(--mute); border-radius: 3px; padding: 1px 4px; margin-right: 6px; vertical-align: 1px; }
.eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
.eq i { width: 3px; background: var(--accent); animation: eq 0.9s ease-in-out infinite; height: 40%; }
.eq i:nth-child(2) { animation-delay: -.3s; } .eq i:nth-child(3) { animation-delay: -.6s; }
.paused .eq i { animation-play-state: paused; }
@keyframes eq { 0%,100% { height: 25%; } 50% { height: 100%; } }
.empty { color: var(--mute); padding: 26px 10px; text-align: center; line-height: 1.6; border: 1px dashed var(--line); border-radius: 10px; }
.empty b { color: var(--fg); display: block; font-size: 16px; margin-bottom: 4px; }

/* Playlist header */
.hero { display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap; }
.hero-art { width: clamp(140px, 22vw, 220px); aspect-ratio: 1; border-radius: 8px; box-shadow: 0 14px 40px rgba(0,0,0,.5); overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; flex: none; max-width: 100%; }
.hero-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero-art.one { grid-template-columns: 1fr; }
.hero-art .pl-ico { width: 100%; height: 100%; border-radius: 0; }
.hero-art .pl-ico svg { width: 40%; height: 40%; }
.hero-txt { min-width: 0; flex: 1 1 260px; display: flex; flex-direction: column; gap: 8px; }
.eyebrow { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--mute); }
.hero-txt h1 { font-size: clamp(32px, 6vw, 80px); overflow-wrap: anywhere; }
.hero-txt p { margin: 0; color: var(--mute); }
.actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.actions .fab { width: 56px; height: 56px; }
.actions .fab svg { width: 26px; height: 26px; }
.ghost { border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-weight: 600; color: var(--fg); }
.ghost:hover { border-color: var(--fg); }
.ghost.danger { color: var(--danger); }

/* Search */
.search-box { display: flex; align-items: center; gap: 10px; background: var(--raise); border-radius: 999px; padding: 0 16px; border: 1px solid transparent; max-width: 520px; }
.search-box:focus-within { border-color: var(--fg); }
.search-box input { flex: 1; min-width: 0; background: none; border: 0; outline: none; height: 48px; font-size: 16px; }
.search-box input::placeholder { color: var(--mute); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { padding: 6px 14px; border-radius: 999px; background: var(--raise); font-weight: 600; font-size: 13px; }
.chip:hover { background: var(--hover); }
.chip.on { background: var(--fg); color: var(--bg); }

.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 22px; text-align: center; color: var(--mute); line-height: 1.6; }
.drop.over { border-color: var(--accent); color: var(--fg); background: rgba(30,215,96,0.08); }
.drop label { color: var(--accent); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* Queue drawer */
.queue { grid-row: 1; width: 320px; background: var(--panel); border-radius: var(--r); display: flex; flex-direction: column; min-height: 0; }
.queue-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 10px 8px 18px; }
.queue-head h2 { font-size: 18px; }
.queue-body { overflow-y: auto; padding: 4px 8px 16px; display: flex; flex-direction: column; gap: 14px; }
.queue-body h3 { margin: 0 0 4px; padding: 0 8px; font-size: 13px; color: var(--mute); font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
.queue-body h3 button { color: var(--mute); font-size: 12px; font-weight: 600; }
.queue-body h3 button:hover { color: var(--fg); }
.qrow { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 6px; }
.qrow:hover { background: var(--hover); }
.qrow img { width: 40px; height: 40px; border-radius: 4px; flex: none; }
.qrow .qt { min-width: 0; flex: 1; cursor: pointer; }
.qrow b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qrow.cur b { color: var(--accent); }
.qrow small { color: var(--mute); font-size: 12px; }
.qrow .icon-btn { opacity: 0; width: 28px; height: 28px; }
.qrow:hover .icon-btn, .qrow:focus-within .icon-btn { opacity: 1; }

/* Player bar */
.player { grid-column: 1 / -1; grid-row: 2; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, 1fr); align-items: center; gap: 16px; padding: 10px 8px calc(10px + env(safe-area-inset-bottom, 0px)); }
.np { display: flex; align-items: center; gap: 12px; min-width: 0; }
.np img { width: 56px; height: 56px; border-radius: 6px; flex: none; }
.np .np-t { min-width: 0; }
.np b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np small { color: var(--mute); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.ctrl { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.btns { display: flex; align-items: center; gap: 14px; }
.btns .icon-btn { position: relative; }
.btns .icon-btn.on::after { content: ""; position: absolute; bottom: 1px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--accent); }
.rep1 { position: absolute; top: 3px; right: 3px; font-size: 9px; font-weight: 800; color: var(--accent); }
.play { width: 40px; height: 40px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; }
.play:hover { transform: scale(1.05); }
.seek { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 600px; color: var(--mute); font-size: 12px; font-variant-numeric: tabular-nums; }
.seek span { width: 38px; text-align: center; flex: none; }
.right { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
.vol { width: 110px; }
input[type=range] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 4px; background: linear-gradient(to right, var(--fg) var(--p, 0%), #4a4156 var(--p, 0%)); cursor: pointer; flex: 1; min-width: 0; margin: 0; }
input[type=range]:hover { background: linear-gradient(to right, var(--accent) var(--p, 0%), #4a4156 var(--p, 0%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--fg); opacity: 0; }
input[type=range]:hover::-webkit-slider-thumb, input[type=range]:focus-visible::-webkit-slider-thumb { opacity: 1; }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--fg); }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.mnav { display: none; }

/* Popover menu, modal, toast */
.menu { position: fixed; z-index: 50; background: var(--raise); border-radius: 8px; padding: 4px; min-width: 210px; max-width: calc(100vw - 24px); box-shadow: 0 16px 40px rgba(0,0,0,.6); display: flex; flex-direction: column; max-height: 70vh; overflow-y: auto; }
.menu button { text-align: left; padding: 10px 12px; border-radius: 5px; display: flex; gap: 10px; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu button:hover, .menu button:focus-visible { background: var(--hover); }
.menu a.menu-link { text-align: left; padding: 10px 12px; border-radius: 5px; display: flex; gap: 10px; align-items: center; color: var(--fg); text-decoration: none; }
.menu a.menu-link:hover { background: var(--hover); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.menu .lbl { padding: 8px 12px 4px; color: var(--mute); font-size: 12px; font-weight: 700; }
.scrim { position: fixed; inset: 0; background: rgba(8,6,12,.7); z-index: 60; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--raise); border-radius: 12px; padding: 22px; width: min(420px, 100%); display: flex; flex-direction: column; gap: 16px; }
.modal h2 { font-size: 20px; }
.modal p { margin: 0; color: var(--mute); line-height: 1.5; }
.modal input { background: var(--hover); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; outline: none; }
.modal input:focus { border-color: var(--fg); }
.modal .row-btns { display: flex; justify-content: flex-end; gap: 10px; }
.solid { background: var(--fg); color: var(--bg); border-radius: 999px; padding: 9px 18px; font-weight: 700; }
.solid.danger { background: var(--danger); color: var(--accent-ink); }
.toast { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(10px); background: #3d6df2; color: #fff; padding: 9px 16px; border-radius: 8px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 70; max-width: calc(100vw - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%); }

@media (max-width: 1100px) { .tl-head, .row { grid-template-columns: 30px minmax(0, 1fr) 36px 48px 36px; } .tl-head .g, .row .g { display: none; } }
@media (max-width: 1000px) { .queue { position: fixed; z-index: 40; right: max(8px, env(safe-area-inset-right, 0px)); top: calc(8px + env(safe-area-inset-top, 0px)); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 20px 60px rgba(0,0,0,.6); max-width: calc(100vw - 16px); } }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto auto; gap: 0; padding: 0; }
  .side { display: none; }
  .main { border-radius: 0; }
  .player { grid-template-columns: minmax(0, 1fr) auto; grid-row: 2; gap: 8px; margin: 0 8px; margin-left: max(8px, env(safe-area-inset-left, 0px)); margin-right: max(8px, env(safe-area-inset-right, 0px)); padding: 8px; background: var(--raise); border-radius: 8px; position: relative; }
  .np img { width: 42px; height: 42px; }
  .ctrl { order: 2; }
  .ctrl .seek { position: absolute; left: 8px; right: 8px; bottom: 0; max-width: none; }
  .ctrl .seek span { display: none; }
  .ctrl .seek input { height: 2px; }
  .btns { gap: 4px; }
  .btns .shuf, .btns .rep { display: none; }
  .right { display: none; }
  .mnav { display: flex; grid-row: 3; justify-content: space-around; padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(180deg, transparent, var(--bg) 30%); }
  .mnav button { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--mute); padding: 6px 10px; font-weight: 600; }
  .mnav button.on { color: var(--fg); }
  .player { padding-bottom: 10px; }
  .queue { left: 8px; right: 8px; width: auto; bottom: calc(130px + env(safe-area-inset-bottom, 0px)); }
  .tl-head { display: none; }
  .tl-head, .row { grid-template-columns: minmax(0, 1fr) 36px 36px; padding: 0 4px; }
  .row .num, .row .d { display: none; }
  .row .like { opacity: 1; }
  .row .more { opacity: 1; }
  .qtile .fab { display: none; }
  .qtile { padding-right: 10px; }
  .card .fab { opacity: 1; transform: none; width: 40px; height: 40px; }

<script>
"use strict";
/* ============ Synth: every Beleşify Stüdyo track is composed and rendered in the browser ============ */
const mulberry32 = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const SCALES = {
  minor: [0, 2, 3, 5, 7, 8, 10], dorian: [0, 2, 3, 5, 7, 9, 10], major: [0, 2, 4, 5, 7, 9, 11],
  lydian: [0, 2, 4, 6, 7, 9, 11], hicaz: [0, 1, 4, 5, 7, 8, 10]
};
const deg = (sc, root, d) => { const n = sc.length, o = Math.floor(d / n), i = ((d % n) + n) % n; return root + sc[i] + 12 * o; };

const STYLES = {
  lofi:  { drums: "lofi", bass: "long", pad: "keys", arp: null, lead: "soft", swing: 0.16, lofi: true, chord: 4, rev: 0.3 },
  synth: { drums: "synth", bass: "root8", pad: "saw", arp: "up16", lead: "saw", swing: 0, chord: 3, rev: 0.4 },
  chip:  { drums: "chip", bass: "chip", pad: null, arp: "chip", lead: "square", swing: 0, chord: 3, rev: 0.12 },
  ambient: { drums: null, bass: "long", pad: "wide", arp: null, lead: "bell", swing: 0, chord: 4, rev: 0.7 },
  house: { drums: "four", bass: "offbeat", pad: "stab", arp: null, lead: "pluck", swing: 0.05, chord: 4, rev: 0.3 },
  maqam: { drums: "maqsum", bass: "root8", pad: "saw", arp: null, lead: "pluck", swing: 0, chord: 3, rev: 0.35 }
};

const STUDIO = [
  { id: "g1", title: "Kadıköy Gecesi", artist: "Moda Kayıtları", genre: "Lo-fi", style: "lofi", bpm: 78, root: 57, scale: "dorian", prog: [0, 3, 6, 4], seed: 101 },
  { id: "g2", title: "Boğaz Neonu", artist: "Neon Vapur", genre: "Synthwave", style: "synth", bpm: 100, root: 52, scale: "minor", prog: [0, 5, 2, 6], seed: 202 },
  { id: "g3", title: "Hicaz Dalgası", artist: "Makam Modüler", genre: "Makam Elektronik", style: "maqam", bpm: 108, root: 50, scale: "hicaz", prog: [0, 3, 0, 6], seed: 303 },
  { id: "g4", title: "Ege Sabahı", artist: "Ege Kıyısı", genre: "Ambient", style: "ambient", bpm: 70, root: 50, scale: "major", prog: [0, 3, 5, 4], seed: 404 },
  { id: "g5", title: "Galata 1987", artist: "Pixel Simit", genre: "Chiptune", style: "chip", bpm: 140, root: 48, scale: "major", prog: [0, 5, 3, 4], seed: 505 },
  { id: "g6", title: "Metrobüs", artist: "Gece Hattı", genre: "House", style: "house", bpm: 122, root: 53, scale: "minor", prog: [0, 5, 3, 4], seed: 606 },
  { id: "g7", title: "Çay Molası", artist: "Moda Kayıtları", genre: "Lo-fi", style: "lofi", bpm: 84, root: 53, scale: "major", prog: [1, 4, 0, 5], seed: 707 },
  { id: "g8", title: "Kapadokya Balonları", artist: "Ege Kıyısı", genre: "Ambient", style: "ambient", bpm: 66, root: 53, scale: "lydian", prog: [0, 1, 0, 4], seed: 808 },
  { id: "g9", title: "Sonsuz Döngü", artist: "Neon Vapur", genre: "Synthwave", style: "synth", bpm: 92, root: 55, scale: "minor", prog: [0, 3, 5, 4], seed: 909 },
  { id: "g10", title: "Yağmurlu Beyoğlu", artist: "Moda Kayıtları", genre: "Lo-fi", style: "lofi", bpm: 72, root: 50, scale: "minor", prog: [0, 5, 2, 6], seed: 1010 },
  { id: "g11", title: "Sahil Yolu", artist: "Gece Hattı", genre: "House", style: "house", bpm: 118, root: 55, scale: "dorian", prog: [0, 3, 0, 4], seed: 1111 },
  { id: "g12", title: "Sultanahmet Akşamı", artist: "Makam Modüler", genre: "Makam Elektronik", style: "maqam", bpm: 96, root: 52, scale: "hicaz", prog: [0, 6, 3, 0], seed: 1212 }
];

function arrange(def) {
  const st = STYLES[def.style];
  const m = def.bpm >= 115 ? 2 : 1;
  const drumsL = st.drums ? "d" : "";
  const secs = [
    [4, "p" + (def.style === "chip" ? "a" : "")],
    [8 * m, "pb" + drumsL],
    [8 * m, "pbla" + drumsL],
    [4, "pa"],
    [8 * m, "pbla" + drumsL],
    [4, "p"]
  ];
  const bars = [];
  secs.forEach(([n, L]) => { for (let i = 0; i < n; i++) bars.push(L); });
  return bars;
}
const trackLength = def => arrange(def).length * (240 / def.bpm) + 2.5;

function makeMotif(rnd) {
  const rhythms = [[0, 3, 6, 8, 10, 12], [0, 2, 4, 7, 10], [0, 4, 6, 8, 12, 14], [0, 3, 4, 8, 11, 12, 14], [0, 6, 8, 12], [0, 2, 3, 6, 8, 12]];
  const notes = [];
  for (let half = 0; half < 2; half++) {
    const r = rhythms[Math.floor(rnd() * rhythms.length)];
    let off = [0, 2, 4][Math.floor(rnd() * 3)];
    r.forEach((s, i) => {
      if (i > 0) {
        off = s % 4 === 0 ? [0, 2, 4, 7][Math.floor(rnd() * 4)] : off + [-1, 1, -2, 2, 1, -1][Math.floor(rnd() * 6)];
        off = Math.max(-2, Math.min(9, off));
      }
      notes.push({ s: s + half * 16, len: (r[i + 1] ?? 16) - s, off });
    });
  }
  return notes;
}

function impulseData(sr, secs, rnd) {
  const n = Math.floor(sr * secs);
  return [0, 1].map(() => { const d = new Float32Array(n); for (let i = 0; i < n; i++) d[i] = (rnd() * 2 - 1) * Math.pow(1 - i / n, 2.6); return d; });
}
function toBuffer(ctx, chans) {
  const b = ctx.createBuffer(chans.length, chans[0].length, ctx.sampleRate);
  chans.forEach((d, c) => b.copyToChannel(d, c));
  return b;
}

// Every chunk gets its own linear bus (sum, optional lowpass, reverb, delay); chunks are overlap-added afterwards.
function buildBus(ctx, st, spb, shared) {
  const comp = ctx.createGain();
  let tail = comp;
  if (st.lofi) { const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3800; comp.connect(lp); tail = lp; }
  tail.connect(ctx.destination);
  const conv = ctx.createConvolver(); conv.normalize = false; conv.buffer = toBuffer(ctx, shared.ir);
  const rev = ctx.createGain(); rev.gain.value = st.rev; rev.connect(conv); conv.connect(comp);
  const dl = ctx.createDelay(2); dl.delayTime.value = spb * 0.75;
  const fb = ctx.createGain(); fb.gain.value = 0.33;
  const dly = ctx.createGain(); dly.connect(dl); dl.connect(fb); fb.connect(dl);
  const dlf = ctx.createBiquadFilter(); dlf.type = "lowpass"; dlf.frequency.value = 2400; dl.connect(dlf); dlf.connect(comp);
  return { ctx, out: comp, rev, dly, noise: toBuffer(ctx, [shared.noise]) };
}

function route(R, node, o) {
  let out = node;
  if (o.pan) { const p = R.ctx.createStereoPanner(); p.pan.value = o.pan; node.connect(p); out = p; }
  out.connect(R.out);
  if (o.rev) { const s = R.ctx.createGain(); s.gain.value = o.rev; out.connect(s); s.connect(R.rev); }
  if (o.dly) { const s = R.ctx.createGain(); s.gain.value = o.dly; out.connect(s); s.connect(R.dly); }
}

function tone(R, o) {
  const c = R.ctx, t = o.t, a = o.a ?? 0.005, g = c.createGain();
  let end;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(o.vol, t + a);
  if (o.decay) { g.gain.exponentialRampToValueAtTime(0.0001, t + a + o.decay); end = t + a + o.decay + 0.03; }
  else { const hold = t + Math.max(a, o.dur), rel = o.rel ?? 0.08; g.gain.setValueAtTime(o.vol, hold); g.gain.exponentialRampToValueAtTime(0.0001, hold + rel); end = hold + rel + 0.03; }
  let input = g;
  if (o.cut) {
    const f = c.createBiquadFilter(); f.type = "lowpass"; f.Q.value = o.q ?? 0.7;
    f.frequency.setValueAtTime(o.cut, t);
    if (o.cutEnd) f.frequency.exponentialRampToValueAtTime(o.cutEnd, t + (o.cutT || o.decay || o.dur));
    f.connect(g); input = f;
  }
  const n = o.n || 1;
  for (let i = 0; i < n; i++) {
    const osc = c.createOscillator(); osc.type = o.type || "sine"; osc.frequency.value = o.f;
    if (n > 1) osc.detune.value = (i - (n - 1) / 2) * (o.det ?? 12);
    osc.connect(input); osc.start(t); osc.stop(end);
  }
  route(R, g, o);
}

function hit(R, o) {
  const c = R.ctx, src = c.createBufferSource(); src.buffer = R.noise;
  const f = c.createBiquadFilter(); f.type = o.ft || "highpass"; f.frequency.value = o.ff || 7000; f.Q.value = o.q || 0.7;
  const g = c.createGain(); g.gain.setValueAtTime(o.vol, o.t); g.gain.exponentialRampToValueAtTime(0.0001, o.t + o.decay);
  src.connect(f); f.connect(g); route(R, g, o);
  src.start(o.t, Math.random() * 1.5, o.decay + 0.05);
}

function kick(R, t, vol, f0 = 150, f1 = 42, d = 0.38) {
  const c = R.ctx, o = c.createOscillator(), g = c.createGain();
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + 0.13);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(R.out); o.start(t); o.stop(t + d + 0.02);

let db = null;

function dbAll() {

  if (!files.length) return toast("Ses dosyası bulunamadı. MP3, M4A, OGG, WAV veya FLAC deneyin.");
  let ok = 0, persisted = true;

const fmt = s => { if (!isFinite(s) || s < 0) s = 0; s = Math.round(s); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

function getUrl(t) {
  if (urlCache.has(t.id)) { const u = urlCache.get(t.id); urlCache.delete(t.id); urlCache.set(t.id, u); return Promise.resolve(u); }
  if (t.kind === "local") { const u = URL.createObjectURL(t.blob); urlCache.set(t.id, u); return Promise.resolve(u); }
  if (pending.has(t.id)) return pending.get(t.id);
  const p = renderTrack(t).then(buf => {
    const u = URL.createObjectURL(toWav(buf));
    urlCache.set(t.id, u); pending.delete(t.id);
    while (urlCache.size > 6) { const [k, v] = urlCache.entries().next().value; if (k === P.cur) { urlCache.delete(k); urlCache.set(k, v); continue; } URL.revokeObjectURL(v); urlCache.delete(k); }
    return u;
  }).catch(e => { pending.delete(t.id); throw e; });
  pending.set(t.id, p);
  return p;
}

function buildOrder(startIdx) {
  const n = P.ctx.length, idx = [...Array(n).keys()];
  if (S.shuffle) {
    const rest = idx.filter(i => i !== startIdx);
    for (let i = rest.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [rest[i], rest[j]] = [rest[j], rest[i]]; }
    P.order = startIdx >= 0 ? [startIdx, ...rest] : rest;
    P.pos = startIdx >= 0 ? 0 : -1;
  } else { P.order = idx; P.pos = startIdx; }
}

function playContext(ids, startId, name) {
  ids = ids.filter(id => tracks.has(id));
  if (!ids.length) return;
  P.ctx = ids; P.ctxName = name || "";
  let si = startId ? ids.indexOf(startId) : -1;
  if (si < 0) si = S.shuffle ? Math.floor(Math.random() * ids.length) : 0;
  buildOrder(si);
  load(P.ctx[P.order[P.pos]]);
}

async function load(id, autoplay = true) {
  const t = tracks.get(id); if (!t) return;
  const my = ++P.token;
  eng.pause();
  P.cur = id; P.loading = t.kind === "gen" && !urlCache.has(id);
  if (t.kind === "yt") {
    eng.mode = "yt"; audio.removeAttribute("src"); audio.load();
    P.loading = true; ytState = -1; showVideo(true);
    updatePlayer(); render(false); renderQueue();
    try { await ensureYT(); } catch (e) { if (my === P.token) { P.loading = false; updatePlayer(); render(false); toast("YouTube oynatıcısı yüklenemedi. İnternet bağlantını kontrol et."); } return; }
    if (my !== P.token) return;
    try { autoplay ? yt.loadVideoById(t.vid) : (yt.cueVideoById(t.vid), P.loading = false); } catch (e) {}
    ytStartCheck = autoplay ? Date.now() : 0;
    setSession(t); updatePlayer(); render(false);
    return;
  }
  if (eng.mode === "yt") { try { yt && yt.stopVideo(); } catch (e) {} ytState = -1; }
  eng.mode = "audio"; showVideo(false);
  updatePlayer(); render(false); renderQueue();
  try {
    const u = await getUrl(t);
    if (my !== P.token) return;
    P.loading = false;
    audio.src = u; audio.currentTime = 0;
    if (autoplay) await audio.play().catch(() => {});
    
    setSession(t);
    prefetch();
  } catch (e) {
    if (my !== P.token) return;
    P.loading = false; toast("Şarkı hazırlanamadı. Sonrakine geçiliyor."); next(true);
  }
  updatePlayer(); render(false);
}

function upcomingIds(limit = 30) {
  const out = [];
  for (let k = P.pos + 1; k < P.order.length && out.length < limit; k++) out.push(P.ctx[P.order[k]]);
  if (S.repeat === 1 && P.order.length) for (let k = 0; k <= P.pos && out.length < limit; k++) out.push(P.ctx[P.order[k]]);
  return out;
}

  if (t && t.kind === "gen" && !urlCache.has(nid)) setTimeout(() => getUrl(t).catch(() => {}), 1200);
}

function next(auto = false) {
  if (auto && S.repeat === 2 && P.cur) { eng.currentTime = 0; eng.play(); return; }
  if (P.manual.length) { P.fromManual = true; return load(P.manual.shift()); }
  P.fromManual = false;
  if (!P.order.length) return;
  if (P.pos + 1 < P.order.length) P.pos++;
  else if (S.repeat === 1) { if (S.shuffle) buildOrder(-1); P.pos = 0; }
  else { if (auto) { eng.pause(); eng.currentTime = 0; P.pos = 0; return load(P.ctx[P.order[0]], false); } return; }
  load(P.ctx[P.order[P.pos]]);
}
function prev() {
  if (eng.currentTime > 3 || !P.order.length) { eng.currentTime = 0; return; }
  if (P.fromManual) { P.fromManual = false; return load(P.ctx[P.order[P.pos]]); }
  if (P.pos > 0) P.pos--; else if (S.repeat === 1) P.pos = P.order.length - 1; else { eng.currentTime = 0; return; }
  load(P.ctx[P.order[P.pos]]);
}

    <div><h1>${greeting()}</h1><p class="lede">Abonelik yok. YouTube'daki şarkıları bağlantısını yapıştırarak ekle, kendi müzik dosyalarını bırak ya da tarayıcında bestelenen Beleşify Stüdyo parçalarını dinle.</p></div>
    ${installEvt ? `<button class="ghost" data-act="install" style="align-self:flex-start">${icon("upload")} Beleşify'ı bu cihaza kur</button>` : ""}
    <div class="quick">${qt.join("")}</div>
    <section class="sec"><div class="sec-head"><h2>YouTube'dan</h2><button class="ghost" data-go="yt">Şarkı ekle</button></div>
      <div class="cards">${ytTrackIds().slice(0, 8).map(id => card(tracks.get(id), ytTrackIds(), "yt")).join("")}</div></section>
    <section class="sec"><div class="sec-head"><h2>Beleşify Stüdyo'dan</h2><p>${STUDIO.length} özgün parça</p></div>
      <div class="cards">${STUDIO.map(t => card(tracks.get(t.id), studioIds, "Beleşify Stüdyo")).join("")}</div></section>
    <section class="sec"><div class="sec-head"><h2>Türlere göz at</h2></div>${genreGrid()}</section>
    <section class="sec"><div class="sec-head"><h2>Senin dosyaların</h2>${locals.length ? `<p>${locals.length} şarkı</p>` : ""}</div>
      ${locals.length ? `<div class="cards">${locals.slice(0, 8).map(t => card(t, locals.map(x => x.id), "Dosyalarım")).join("")}</div>` : dropZone()}</section>
    <div class="note">${icon("wave")}<p><b>Müzik nereden geliyor?</b> Stüdyo parçaları kodla üretilen özgün besteler: her biri kendi temposu, gamı ve akor yürüyüşüyle (Hicaz Dalgası gerçekten Hicaz makamında ve maqsum ritmiyle çalıyor). Kendi eklediğin dosyalar yalnızca bu tarayıcıda saklanır, hiçbir yere yüklenmez.</p></div>
  </div>`;
}
const GENRE_TINT = { "Lo-fi": "#7a4a2f", "Synthwave": "#8a2f6b", "Makam Elektronik": "#2f5e7a", "Ambient": "#2f6a5a", "Chiptune": "#4a3f9a", "House": "#9a3f3f", "YouTube": "#8f2a2a", "Dosyalarım": "#555066" };
function genreGrid() {
  return `<div class="genres">${genres().map(g => { const first = STUDIO.find(t => t.genre === g); const n = STUDIO.filter(t => t.genre === g).length; return `<button class="genre" style="background:${GENRE_TINT[g]}" data-genre="${esc(g)}"><span>${esc(g)}</span><small>${n} parça</small><img src="${coverOf(tracks.get(first.id))}" alt=""></button>`; }).join("")}</div>`;
}
function dropZone() {
  return `<div class="drop" data-drop>Bilgisayarındaki MP3, M4A, OGG, WAV veya FLAC dosyalarını buraya sürükle ya da <label for="fileIn">dosya seç</label>.<br>Dosyalar sadece bu tarayıcıda kalır.</div>`;
}

function viewSearch() {
  const q = searchQ.trim().toLocaleLowerCase("tr");
  const all = [...tracks.values()];
  let res = all;
  if (searchGenre) res = res.filter(t => t.genre === searchGenre);
  if (q) res = res.filter(t => (t.title + " " + t.artist + " " + t.genre).toLocaleLowerCase("tr").includes(q));
  const pls = q ? S.playlists.filter(p => p.name.toLocaleLowerCase("tr").includes(q)) : [];
  const showing = q || searchGenre;
  const chipList = [...genres(), ...(all.some(t => t.kind === "yt") ? ["YouTube"] : []), ...(all.some(t => t.kind === "local") ? ["Dosyalarım"] : [])];
  return `<div class="view">
    <h1>Ara</h1>
    <div class="search-box">${icon("search")}<input id="q" type="search" placeholder="Şarkı, sanatçı veya tür" value="${esc(searchQ)}" autocomplete="off" aria-label="Ara"></div>
    <div class="chips">${chipList.map(g => `<button class="chip${searchGenre === g ? " on" : ""}" data-chip="${esc(g)}">${esc(g)}</button>`).join("")}</div>
    <div id="results">${showing ? `
      ${pls.length ? `<section class="sec" style="margin-bottom:24px"><h2>Çalma listeleri</h2><div class="quick">${pls.map(p => `<button class="qtile" data-go="pl:${p.id}">${plThumb(p)}<span>${esc(p.name)}</span></button>`).join("")}</div></section>` : ""}
      ${q && S.ytKey ? `<button class="ghost" data-act="yt-search-from" data-q="${esc(searchQ)}" style="align-self:flex-start;margin-bottom:18px">${icon("yt")} "${esc(searchQ)}" için YouTube'da ara</button>` : ""}<section class="sec"><div class="sec-head"><h2>Şarkılar</h2><p>${res.length} sonuç</p></div>${trackList(res.map(t => t.id), "search:" + q + "|" + searchGenre, { empty: `<b>"${esc(searchQ || searchGenre)}" için sonuç yok</b>Başka bir kelime dene ya da kendi dosyalarını ekle.` })}</section>`
      : `<section class="sec"><h2>Hepsine göz at</h2>${genreGrid()}</section>`}</div>
  </div>`;
}

function viewYT() {
  const ids = ytTrackIds();
  const results = ytResults.map(r => { const have = tracks.has("yt-" + r.vid); return `<div class="yrow"><img src="https://i.ytimg.com/vi/${r.vid}/mqdefault.jpg" alt="" loading="lazy"><div class="yt-t"><b>${esc(r.title)}</b><small>${esc(r.artist)}${r.duration ? " · " + fmt(r.duration) : ""}</small></div>
    <button class="icon-btn" data-act="yt-play" data-vid="${r.vid}" aria-label="${esc(r.title)} çal">${icon("play")}</button>
    <button class="icon-btn${have ? " on" : ""}" data-act="yt-add" data-vid="${r.vid}" aria-label="${have ? "Eklendi" : "Kitaplığa ekle"}" title="${have ? "Eklendi" : "Kitaplığa ekle"}">${icon(have ? "heart" : "plus")}</button></div>`; }).join("");
  return `<div class="view tinted" style="--tint:#5a1f24">
    <div><h1>YouTube</h1><p class="lede">Bir video ya da oynatma listesi bağlantısını yapıştır. Şarkılar YouTube'un kendi oynatıcısıyla çalar; videonun küçük penceresi sağ altta açık kalır.</p></div>
    <form class="ytadd" id="ytAddForm"><input id="ytUrl" placeholder="https://www.youtube.com/watch?v=… ya da playlist?list=…" autocomplete="off" aria-label="YouTube bağlantısı"><button class="solid" ${ytBusy ? "disabled" : ""}>${ytBusy ? "Okunuyor…" : "Ekle"}</button></form>
    <section class="sec"><div class="sec-head"><h2>YouTube'da ara</h2>${S.ytKey ? `<button class="ghost" data-act="yt-forget-key">Anahtarı kaldır</button>` : ""}</div>
      ${S.ytKey ? `<form class="ytadd" id="ytSearchForm"><input id="ytQ" type="search" placeholder="Şarkı veya sanatçı" value="${esc(ytQuery)}" autocomplete="off" aria-label="YouTube'da ara"><button class="solid" ${ytBusy ? "disabled" : ""}>Ara</button></form>
        ${results ? `<div class="yres">${results}</div>` : ytQuery && !ytBusy ? `<div class="empty"><b>Sonuç yok</b>Başka bir şey ara.</div>` : ""}`
      : `<div class="note">${icon("search")}<p><b>Arama için ücretsiz bir YouTube API anahtarı gerekiyor.</b> Bağlantı yapıştırmak için gerekmez. Anahtarı <a href="https://console.cloud.google.com/apis/library/youtube.googleapis.com" target="_blank" rel="noopener">Google Cloud Console</a>'da "YouTube Data API v3"ü etkinleştirip Kimlik bilgileri bölümünden bir API anahtarı oluşturarak alabilirsin. Anahtar sadece bu tarayıcıda saklanır.</p></div>
        <form class="ytadd" id="ytKeyForm"><input id="ytKey" placeholder="API anahtarını yapıştır (AIza…)" autocomplete="off" aria-label="YouTube API anahtarı"><button class="solid">Kaydet</button></form>`}
    </section>
    <section class="sec"><div class="sec-head"><h2>YouTube şarkıların</h2><p>${ids.length} şarkı</p></div>
      ${trackList(ids, "yt", { empty: "<b>Henüz YouTube şarkısı eklemedin</b>Yukarıya bir bağlantı yapıştır." })}</section>
  </div>`;
}

function viewLibrary() {
  const all = [...tracks.values()];
  const list = libTab === "files" ? all.filter(t => t.kind === "local") : libTab === "studio" ? all.filter(t => t.kind === "gen") : libTab === "yt" ? all.filter(t => t.kind === "yt") : all;
  const locals = all.filter(t => t.kind === "local").length;
  return `<div class="view">
    <h1>Kitaplığın</h1>
    <div class="chips">
      <button class="chip${libTab === "all" ? " on" : ""}" data-lib="all">Tümü · ${all.length}</button>
      <button class="chip${libTab === "studio" ? " on" : ""}" data-lib="studio">Beleşify Stüdyo · ${STUDIO.length}</button>
      <button class="chip${libTab === "yt" ? " on" : ""}" data-lib="yt">YouTube · ${all.filter(t => t.kind === "yt").length}</button>
      <button class="chip${libTab === "files" ? " on" : ""}" data-lib="files">Dosyalarım · ${locals}</button>
    </div>
    <section class="sec"><div class="sec-head"><h2>Çalma listeleri</h2><button class="ghost" data-act="new-pl">Yeni liste</button></div>
      <div class="quick"><button class="qtile" data-go="liked">${likedThumb()}<span>Beğenilen Şarkılar · ${S.liked.filter(id => tracks.has(id)).length}</span></button>${S.playlists.map(p => `<button class="qtile" data-go="pl:${p.id}">${plThumb(p)}<span>${esc(p.name)} · ${plIds(p).length}</span></button>`).join("")}</div></section>
    <section class="sec"><div class="sec-head"><h2>Şarkılar</h2><p>${totalDur(list.map(t => t.id))}</p></div>
      ${trackList(list.map(t => t.id), "lib:" + libTab, { empty: "<b>Henüz dosya eklemedin</b>Aşağıdaki alana müzik dosyalarını bırak." })}</section>
    ${dropZone()}
  </div>`;
}

function viewPlaylist(p, liked) {
  const ids = liked ? S.liked.filter(id => tracks.has(id)) : plIds(p);
  const name = liked ? "Beğenilen Şarkılar" : p.name, ctxName = liked ? "Beğenilen Şarkılar" : "pl:" + p.id;
  const art = liked ? `<div class="hero-art one"><div class="pl-ico">${icon("heart")}</div></div>` : plArt(p);
  const tint = liked ? "#3b2d7a" : `hsl(${hash(p.id) % 360} 35% 28%)`;
  const active = P.ctxName === ctxName;
  return `<div class="view tinted" style="--tint:${tint}">
    <div class="hero">${art}<div class="hero-txt"><span class="eyebrow">Çalma listesi</span><h1>${esc(name)}</h1>
      <p>${liked ? "Kalbe dokunduğun her şarkı burada." : esc(p.desc || "")}</p><p><b style="color:var(--fg)">Sen</b> · ${ids.length} şarkı, ${totalDur(ids)}</p></div></div>
    <div class="actions">
      <button class="fab" data-act="play-ctx" data-ids="${ids.join(",")}" data-name="${ctxName}" aria-label="Listeyi çal" ${ids.length ? "" : "disabled"}>${playIcon(active)}</button>
      <button class="icon-btn${S.shuffle ? " on" : ""}" data-act="shuffle" title="Karıştır" aria-label="Karıştır" style="width:44px;height:44px">${icon("shuf")}</button>
      ${liked ? "" : `<button class="ghost" data-act="rename-pl" data-id="${p.id}">Yeniden adlandır</button><button class="ghost danger" data-act="del-pl" data-id="${p.id}">Listeyi sil</button>`}
    </div>
    ${trackList(ids, ctxName, { pl: liked ? "liked" : p.id, empty: liked ? "<b>Henüz beğendiğin şarkı yok</b>Bir şarkının yanındaki kalbe dokun." : "<b>Bu liste boş</b>Bir şarkının ⋯ menüsünden “Çalma listesine ekle”yi seç." })}
  </div>`;
}

function render(full = true) {
  const main = $("#main"), st = main.scrollTop;
  let html;
  if (view.name === "home") html = viewHome();
  else if (view.name === "search") html = viewSearch();
  else if (view.name === "library") html = viewLibrary();
  else if (view.name === "yt") html = viewYT();
  else if (view.name === "liked") html = viewPlaylist(null, true);
  else if (view.name.startsWith("pl:")) { const p = plById(view.name.slice(3)); if (!p) { view = { name: "home" }; return render(); } html = viewPlaylist(p); }
  if (!full && view.name === "yt" && document.activeElement?.closest?.(".ytadd")) return;
  if (!full && view.name === "search") {
    // keep the search input (and its focus/caret) intact; refresh only results
    const tmp = document.createElement("div"); tmp.innerHTML = html;
    const r = tmp.querySelector("#results"), cur = $("#results");
    if (cur && r) { cur.innerHTML = r.innerHTML; return; }
  }
  main.innerHTML = html;
  if (!full) main.scrollTop = st;
  document.querySelectorAll("[data-go]").forEach(b => b.classList.toggle("on", b.closest(".nav,.mnav") && b.dataset.go === view.name));
  renderSide();
}

function renderSide() {
  $("#plList").innerHTML = [`<li><button data-go="liked" class="${view.name === "liked" ? "on" : ""}">${likedThumb()}<span class="pl-meta"><b>Beğenilen Şarkılar</b><span>${S.liked.filter(id => tracks.has(id)).length} şarkı</span></span></button></li>`,
    ...S.playlists.map(p => `<li><button data-go="pl:${p.id}" class="${view.name === "pl:" + p.id ? "on" : ""}">${plThumb(p)}<span class="pl-meta"><b>${esc(p.name)}</b><span>${plIds(p).length} şarkı</span></span></button></li>`)].join("");
}

function updatePlayer() {
  const t = P.cur && tracks.get(P.cur);
  $("#np").innerHTML = t ? `<img src="${coverOf(t)}" alt=""><div class="np-t"><b>${esc(t.title)}</b><small>${P.loading ? "Besteleniyor…" : esc(t.artist)}</small></div>
    <button class="icon-btn like${isLiked(t.id) ? " on" : ""}" data-act="like" data-id="${t.id}" aria-label="${isLiked(t.id) ? "Beğenilerden çıkar" : "Beğen"}" style="${isLiked(t.id) ? "color:var(--accent)" : ""}">${icon(isLiked(t.id) ? "heart" : "heart-o")}</button>`
    : `<div class="np-t"><b>Bir şarkı seç</b><small>Ya da çal tuşuna bas</small></div>`;
  const pb = $("#playBtn");
  pb.innerHTML = P.loading ? `<span class="spin"></span>` : icon(eng.paused ? "play" : "pause");
  pb.setAttribute("aria-label", eng.paused ? "Çal" : "Duraklat");
  $("#shufBtn").classList.toggle("on", S.shuffle);
  const rb = $("#repBtn"); rb.classList.toggle("on", S.repeat > 0);
  rb.innerHTML = icon("rep") + (S.repeat === 2 ? `<span class="rep1">1</span>` : "");
  rb.title = ["Tekrarla", "Tümünü tekrarla", "Bu şarkıyı tekrarla"][S.repeat];
  const dur = t ? (eng.duration || t.duration) : 0;
  $("#tDur").textContent = fmt(dur);
  if (!t) { $("#tCur").textContent = "0:00"; setRange($("#seek"), 0); }
}
function setRange(el, frac) { el.style.setProperty("--p", (frac * 100).toFixed(2) + "%"); }

function renderQueue() {
  const q = $("#queue"); if (q.hidden) return;
  const t = P.cur && tracks.get(P.cur);
  const row = (id, idx, kind) => { const x = tracks.get(id); return `<div class="qrow${kind === "cur" ? " cur" : ""}"><img src="${coverOf(x)}" alt=""><div class="qt" data-act="${kind === "cur" ? "toggle" : "q-jump"}" data-kind="${kind}" data-idx="${idx}" role="button" tabindex="0"><b>${esc(x.title)}</b><small>${esc(x.artist)}</small></div>${kind === "cur" ? "" : `<button class="icon-btn" data-act="q-remove" data-kind="${kind}" data-idx="${idx}" aria-label="Sıradan çıkar">${icon("x")}</button>`}</div>`; };
  const up = upcomingIds(40);
  const ctxLabel = P.ctxName.startsWith("pl:") ? (plById(P.ctxName.slice(3))?.name || "Liste") : P.ctxName.startsWith("search:") ? "Arama sonuçları" : P.ctxName.startsWith("lib:") ? "Kitaplığın" : P.ctxName === "yt" ? "YouTube şarkıların" : P.ctxName;
  $("#queueBody").innerHTML = (t ? `<div><h3>Şimdi çalıyor</h3>${row(P.cur, 0, "cur")}</div>` : `<div class="empty"><b>Sıra boş</b>Bir şarkı çalmaya başla.</div>`)
    + (P.manual.length ? `<div><h3>Sıradaki <button data-act="q-clear">Temizle</button></h3>${P.manual.map((id, i) => row(id, i, "manual")).join("")}</div>` : "")
    + (up.length ? `<div><h3>Sonra: ${esc(ctxLabel)}</h3>${up.map((id, i) => row(id, i, "ctx")).join("")}</div>` : "");
}

/* ============ Menus, modals, toast ============ */
const menu = $("#menu");
let menuFor = null;
function openMenu(btn, id) {
  const t = tracks.get(id), tl = btn.closest(".tl"), plId = tl?.dataset.pl;
  menuFor = id;
  menu.innerHTML = `<button data-act="m-queue" data-id="${id}" role="menuitem">${icon("queue")}Sıraya ekle</button>
    <button data-act="m-like" data-id="${id}" role="menuitem">${icon(isLiked(id) ? "heart" : "heart-o")}${isLiked(id) ? "Beğenilerden çıkar" : "Beğenilen Şarkılar'a ekle"}</button>
    <hr><div class="lbl">Çalma listesine ekle</div>
    ${S.playlists.map(p => `<button data-act="m-add" data-id="${id}" data-pl="${p.id}" role="menuitem">${icon(p.ids.includes(id) ? "heart" : "plus")}${esc(p.name)}</button>`).join("")}
    <button data-act="m-newpl" data-id="${id}" role="menuitem">${icon("plus")}Yeni liste oluştur</button>
    ${plId && plId !== "liked" ? `<hr><button data-act="m-rmpl" data-id="${id}" data-pl="${plId}" role="menuitem">${icon("x")}Bu listeden çıkar</button>` : ""}
    ${t.kind === "local" ? `<hr><button data-act="m-delfile" data-id="${id}" role="menuitem" style="color:var(--danger)">${icon("x")}Dosyayı kitaplıktan sil</button>` : ""}
    ${t.kind === "yt" ? `<hr><a class="menu-link" href="https://www.youtube.com/watch?v=${t.vid}" target="_blank" rel="noopener">${icon("yt")}YouTube'da aç</a><button data-act="m-delfile" data-id="${id}" role="menuitem" style="color:var(--danger)">${icon("x")}Kitaplıktan kaldır</button>` : ""}`;
  menu.hidden = false;
  const r = btn.getBoundingClientRect(), mw = menu.offsetWidth, mh = menu.offsetHeight;
  let x = Math.min(r.right - mw, innerWidth - mw - 12), y = r.bottom + 4;
  if (y + mh > innerHeight - 12) y = Math.max(12, r.top - mh - 4);
  menu.style.left = Math.max(12, x) + "px"; menu.style.top = y + "px";
  menu.querySelector("button").focus();
}
function closeMenu() { menu.hidden = true; menuFor = null; }

const scrim = $("#scrim");
function modal(html, onOk) {
  scrim.innerHTML = `<form class="modal" id="mform">${html}</form>`;
  scrim.hidden = false;
  const f = $("#mform"), inp = f.querySelector("input");
  (inp || f.querySelector(".solid")).focus(); if (inp) inp.select();
  f.onsubmit = e => { e.preventDefault(); if (onOk(inp ? inp.value.trim() : true) !== false) closeModal(); };
  f.querySelector("[data-cancel]").onclick = closeModal;
}
function closeModal() { scrim.hidden = true; scrim.innerHTML = ""; }
function newPlaylist(withTrack) {
  modal(`<h2>Yeni çalma listesi</h2><input id="plName" maxlength="60" value="Listem #${S.playlists.length + 1}" aria-label="Liste adı"><div class="row-btns"><button type="button" class="ghost" data-cancel>Vazgeç</button><button class="solid">Oluştur</button></div>`, name => {
    if (!name) return false;
    const p = { id: "pl-" + Date.now().toString(36), name, ids: withTrack ? [withTrack] : [], desc: "" };
    S.playlists.push(p); save();
    toast(withTrack ? `"${name}" oluşturuldu, şarkı eklendi` : `"${name}" oluşturuldu`);
    if (!withTrack) go("pl:" + p.id); else render(false);
  });
}

let toastT;
function toast(msg) { const el = $("#toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2400); }

function toggleLike(id) {
  const i = S.liked.indexOf(id);
  if (i >= 0) S.liked.splice(i, 1); else S.liked.unshift(id);
  save(); toast(i >= 0 ? "Beğenilenlerden çıkarıldı" : "Beğenilen Şarkılar'a eklendi");
  render(false); updatePlayer();
}

function go(name) {
  view = { name }; closeMenu();
  render(); $("#main").scrollTop = 0;
  if (name === "search") setTimeout(() => $("#q")?.focus(), 0);
  if (name === "yt") setTimeout(() => $("#ytUrl")?.focus(), 0);
}

/* ============ Events ============ */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act],[data-go],[data-genre],[data-chip],[data-lib]");
  if (!menu.hidden && !e.target.closest("#menu") && !(el && el.dataset.act === "more")) closeMenu();
  if (!el) return;
  if (el.dataset.go && !el.dataset.act) return go(el.dataset.go);
  if (el.dataset.genre) { searchGenre = el.dataset.genre; searchQ = ""; return go("search"); }
  if (el.dataset.chip) { searchGenre = searchGenre === el.dataset.chip ? "" : el.dataset.chip; return render(false); }
  if (el.dataset.lib) { libTab = el.dataset.lib; return render(false); }
  const a = el.dataset.act, id = el.dataset.id;
  e.stopPropagation();
  switch (a) {
    case "toggle": return toggle();
    case "next": return next();
    case "prev": return prev();
    case "shuffle":
      S.shuffle = !S.shuffle; save();
      if (P.ctx.length && P.pos >= 0) buildOrder(P.order[P.pos]);
      toast(S.shuffle ? "Karıştırma açık" : "Karıştırma kapalı");
      updatePlayer(); renderQueue(); return render(false);
    case "repeat":
      S.repeat = (S.repeat + 1) % 3; save();
      toast(["Tekrar kapalı", "Tümünü tekrarla", "Bu şarkıyı tekrarla"][S.repeat]);
      updatePlayer(); return renderQueue();
    case "mute": eng.muted = !eng.muted; return syncVol();
    case "toggle-queue": { const q = $("#queue"); q.hidden = !q.hidden; $("#queueBtn").classList.toggle("on", !q.hidden); document.body.classList.toggle("queue-open", !q.hidden); return renderQueue(); }
    case "play-ctx": { const ids = (el.dataset.ids || "").split(",").filter(Boolean); if (!ids.length) return toast("Bu listede çalacak şarkı yok"); return playOrToggle(ids, el.dataset.start, el.dataset.name); }
    case "row-play": { const row = el.closest("[data-row]"), tl = el.closest(".tl"); const rid = row.dataset.row; if (P.cur === rid && P.ctxName === tl.dataset.ctx) return toggle(); return playContext(tl.dataset.ids.split(","), rid, tl.dataset.ctx); }
    case "like": return toggleLike(id);
    case "more": return menuFor === id && !menu.hidden ? closeMenu() : openMenu(el, id);
    case "m-queue": P.manual.push(id); closeMenu(); toast("Sıraya eklendi"); if (!P.cur) next(); renderQueue(); return prefetch();
    case "m-like": closeMenu(); return toggleLike(id);
    case "m-add": { const p = plById(el.dataset.pl); closeMenu(); if (p.ids.includes(id)) return toast(`Zaten "${p.name}" listesinde`); p.ids.push(id); save(); toast(`"${p.name}" listesine eklendi`); return render(false); }
    case "m-newpl": closeMenu(); return newPlaylist(id);
    case "m-rmpl": { const p = plById(el.dataset.pl); p.ids = p.ids.filter(x => x !== id); save(); closeMenu(); toast(`"${p.name}" listesinden çıkarıldı`); return render(false); }
    case "m-delfile": {
      closeMenu(); const t = tracks.get(id);
      return modal(`<h2>${t.kind === "yt" ? "Kitaplıktan kaldır" : "Dosyayı sil"}</h2><p>"${esc(t.title)}" bu tarayıcıdaki kitaplığından ${t.kind === "yt" ? "kaldırılacak. YouTube'daki videoya bir şey olmaz." : "silinecek. Bilgisayarındaki asıl dosyaya dokunulmaz."}</p><div class="row-btns"><button type="button" class="ghost" data-cancel>Vazgeç</button><button class="solid danger">Sil</button></div>`, () => {
        if (t.kind === "yt") { tracks.delete(id); saveYT(); } else { dbDel(id); tracks.delete(id); }
        if (urlCache.has(id)) { URL.revokeObjectURL(urlCache.get(id)); urlCache.delete(id); }
        P.manual = P.manual.filter(x => x !== id);
        if (P.cur === id) { eng.pause(); audio.removeAttribute("src"); showVideo(false); eng.mode = "audio"; P.cur = null; }
        S.liked = S.liked.filter(x => x !== id); S.playlists.forEach(p => p.ids = p.ids.filter(x => x !== id)); save();
        toast("Dosya silindi"); updatePlayer(); render(false); renderQueue();
      });
    }
    case "new-pl": return newPlaylist();
    case "rename-pl": { const p = plById(id); return modal(`<h2>Listeyi yeniden adlandır</h2><input id="plName" maxlength="60" value="${esc(p.name)}" aria-label="Liste adı"><div class="row-btns"><button type="button" class="ghost" data-cancel>Vazgeç</button><button class="solid">Kaydet</button></div>`, name => { if (!name) return false; p.name = name; save(); render(false); }); }
    case "del-pl": { const p = plById(id); return modal(`<h2>"${esc(p.name)}" silinsin mi?</h2><p>Liste silinir, içindeki şarkılar kitaplığında kalır.</p><div class="row-btns"><button type="button" class="ghost" data-cancel>Vazgeç</button><button class="solid danger">Listeyi sil</button></div>`, () => { S.playlists = S.playlists.filter(x => x !== p); save(); toast("Liste silindi"); go("home"); }); }
    case "q-jump": {
      const idx = +el.dataset.idx;
      if (el.dataset.kind === "manual") { const [x] = P.manual.splice(idx, 1); P.fromManual = true; return load(x); }
      const steps = idx + 1; let pos = P.pos + steps; if (pos >= P.order.length) pos -= P.order.length;
      P.pos = pos; P.fromManual = false; return load(P.ctx[P.order[P.pos]]);
    }
    case "q-remove": {
      const idx = +el.dataset.idx;
      if (el.dataset.kind === "manual") P.manual.splice(idx, 1);
      else { let k = P.pos + 1 + idx; if (k >= P.order.length) { k -= P.order.length; P.order.splice(k, 1); P.pos--; } else P.order.splice(k, 1); }
      return renderQueue();
    }
    case "install": if (installEvt) { installEvt.prompt(); installEvt = null; el.hidden = true; } return;
    case "q-clear": P.manual = []; return renderQueue();
    case "yt-play": { const r = ytResults.find(x => x.vid === el.dataset.vid); const tid = addYT(r.vid, r); render(false); return playContext(ytTrackIds(), tid, "yt"); }
    case "yt-add": { const r = ytResults.find(x => x.vid === el.dataset.vid); if (tracks.has("yt-" + r.vid)) return toast("Zaten kitaplığında"); addYT(r.vid, r); toast("YouTube şarkıların arasına eklendi"); return render(false); }
    case "yt-forget-key": S.ytKey = ""; ytResults = []; save(); return render(false);
    case "yt-search-from": ytResults = []; go("yt"); return ytSearch(el.dataset.q);
  }
});
// Phones have no hover or double-click: a tap on the row plays it
document.addEventListener("click", e => {
  if (!matchMedia("(max-width: 760px)").matches) return;
  const row = e.target.closest("[data-row]"); if (!row || e.target.closest("button,a")) return;
  const tl = row.closest(".tl"), rid = row.dataset.row;
  if (P.cur === rid && P.ctxName === tl.dataset.ctx) return toggle();
  playContext(tl.dataset.ids.split(","), rid, tl.dataset.ctx);
});
document.addEventListener("dblclick", e => { const row = e.target.closest("[data-row]"); if (!row || e.target.closest("button")) return; const tl = row.closest(".tl"); playContext(tl.dataset.ids.split(","), row.dataset.row, tl.dataset.ctx); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (!scrim.hidden) return closeModal(); if (!menu.hidden) return closeMenu(); }
  if (e.target.closest("input,textarea,select,[contenteditable]")) return;
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[role=button]")) { e.preventDefault(); e.target.click(); return; }
  if (e.code === "Space" && !e.target.closest("button")) { e.preventDefault(); toggle(); }
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === "ArrowRight" && e.shiftKey) next();
  if (e.key === "ArrowLeft" && e.shiftKey) prev();
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { searchQ = e.target.value; render(false); }
});
document.addEventListener("submit", e => {
  const f = e.target;
  if (f.id === "ytAddForm") { e.preventDefault(); const v = $("#ytUrl").value; $("#ytUrl").value = ""; $("#ytUrl").blur(); handleYTInput(v); }
  if (f.id === "ytSearchForm") { e.preventDefault(); $("#ytQ").blur(); ytSearch($("#ytQ").value); }
  if (f.id === "ytKeyForm") { e.preventDefault(); const k = $("#ytKey").value.trim(); if (!/^[\w-]{30,}$/.test(k)) return toast("Bu bir API anahtarına benzemiyor"); S.ytKey = k; save(); toast("Anahtar kaydedildi, artık arayabilirsin"); render(); }
});
scrim.addEventListener("click", e => { if (e.target === scrim) closeModal(); });
$("#fileIn").addEventListener("change", e => { importFiles(e.target.files); e.target.value = ""; });
document.addEventListener("dragover", e => { if (![...(e.dataTransfer?.types || [])].includes("Files")) return; e.preventDefault(); document.querySelectorAll("[data-drop]").forEach(d => d.classList.add("over")); });
document.addEventListener("dragleave", e => { if (e.relatedTarget) return; document.querySelectorAll("[data-drop]").forEach(d => d.classList.remove("over")); });
document.addEventListener("drop", e => { if (!e.dataTransfer?.files?.length) return; e.preventDefault(); document.querySelectorAll("[data-drop]").forEach(d => d.classList.remove("over")); importFiles(e.dataTransfer.files); });

const seek = $("#seek"), vol = $("#vol");
let seeking = false;
seek.addEventListener("input", () => { seeking = true; const d = eng.duration || 0; setRange(seek, seek.value / 1000); $("#tCur").textContent = fmt(d * seek.value / 1000); });
seek.addEventListener("change", () => { if (eng.duration) eng.currentTime = eng.duration * seek.value / 1000; seeking = false; });
function onTime() {
  if (seeking) return; const d = eng.duration || 0, f = d ? eng.currentTime / d : 0;
  seek.value = Math.round(f * 1000); setRange(seek, f); $("#tCur").textContent = fmt(eng.currentTime);
}
audio.addEventListener("timeupdate", onTime);
audio.addEventListener("loadedmetadata", () => { $("#tDur").textContent = fmt(audio.duration); });
audio.addEventListener("ended", () => next(true));
["play", "pause"].forEach(ev => audio.addEventListener(ev, () => { if (eng.mode === "audio") { updatePlayer(); render(false); renderQueue(); } }));
function syncVol() {
  eng.setVolume(S.vol); vol.value = Math.round(S.vol * 100); setRange(vol, eng.muted ? 0 : S.vol);
  $("#muteBtn").innerHTML = icon(eng.muted || S.vol === 0 ? "mute" : "vol");
}
vol.addEventListener("input", () => { S.vol = vol.value / 100; eng.muted = false; syncVol(); save(); });

/* ============ Boot ============ */
if (!/BelesifyApp/.test(navigator.userAgent) && "serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("#installBtn").hidden = false; if (view.name === "home") render(false); });
window.addEventListener("appinstalled", () => { $("#installBtn").hidden = true; toast("Beleşify kuruldu"); });
syncVol();
updatePlayer();
render();
(document.fonts?.ready || Promise.resolve()).then(() => {
  STUDIO.forEach(d => { delete tracks.get(d.id).cover; });
  render(false); updatePlayer();
});
openDB().then(dbAll).then(recs => {
  if (!recs.length) return;
  recs.sort((a, b) => a.added - b.added).forEach(addLocalRecord);
  render(false);
});
</script>
</body>
